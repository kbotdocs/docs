name: "[Dev] Upload content to R2"
on:
  workflow_dispatch:
    inputs:
      refresh_cache_metadata:
        description: Re-upload all content to refresh R2 cache metadata
        required: false
        default: false
        type: boolean
  push:
    branches: [dev]
    paths:
      - "docs/**"
      - "compatibility/**"
      - "scripts/validate-navigation.mjs"
      - "scripts/validate-compatibility.mjs"
      - ".github/workflows/dev.yml"
      - ".github/workflows/upload.yml"
jobs:
  upload:
    uses: ./.github/workflows/upload.yml
    with:
      bucket_prefix: dev-
      refresh_cache_metadata: ${{ inputs.refresh_cache_metadata || false }}
    secrets: inherit
